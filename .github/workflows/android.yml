name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  NDK_VERSION: "27.0.12077973"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate app icons
        run: cargo tauri icon app-icon.png

      - name: Init Android project
        run: cargo tauri android init

      # Debug-signed build = installable on any phone without a keystore
      - name: Build APK
        run: cargo tauri android build --apk --debug --target aarch64 armv7

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: One-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
