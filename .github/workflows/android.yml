name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  NDK_VERSION: "27.0.12077973"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate app icons
        run: cargo tauri icon app-icon.png

      - name: Init Android project
        run: cargo tauri android init

      # Final Release Build (Size-optimized, LTO, stripped symbols)
      - name: Build Release APK
        run: cargo tauri android build --apk --target aarch64 armv7

      # Sign release APKs so they install directly on any phone without keystore errors
      - name: Sign Release APK
        run: |
          mkdir -p release-apks
          # Generate signing keystore
          keytool -genkey -v -keystore release.keystore -alias one -keyalg RSA -keysize 2048 -validity 10000 -storepass "onefocuspass" -keypass "onefocuspass" -dname "CN=One Single Focus, OU=One, O=One, L=City, S=State, C=US"
          
          # Find all APKs and sign them with apksigner
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | while read -r apk; do
            echo "Signing $apk..."
            base=$(basename "$apk" .apk)
            clean_name="${base/-unsigned/}"
            out="release-apks/${clean_name}.apk"
            ${ANDROID_HOME}/build-tools/34.0.0/apksigner sign --ks release.keystore --ks-pass pass:onefocuspass --key-pass pass:onefocuspass --out "$out" "$apk"
          done
          
          # Provide One-final.apk convenience copy
          if compgen -G "release-apks/*universal*.apk" > /dev/null; then
            cp release-apks/*universal*.apk release-apks/One-final.apk
          elif compgen -G "release-apks/*arm64*.apk" > /dev/null; then
            cp release-apks/*arm64*.apk release-apks/One-final.apk
          else
            first_apk=$(ls release-apks/*.apk | head -n 1)
            cp "$first_apk" release-apks/One-final.apk
          fi
          
          echo "Release APKs built and signed successfully:"
          ls -lh release-apks/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: One-final-release-apk
          path: release-apks/*.apk
