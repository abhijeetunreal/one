[package]
name = "one"
version = "0.1.0"
edition = "2021"

[lib]
name = "one_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "one"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
